<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="chqShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="580" height="300" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" filter="url(#chqShadow)"/>
  <rect x="25" y="25" width="550" height="270" rx="4" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1"/>
  
  <!-- Bank Header -->
  <text x="45" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#047857">HDFC BANK LTD</text>
  <text x="45" y="72" font-family="Arial, sans-serif" font-size="10" fill="#64748B">WAKAD BRANCH, PUNE - 411057 • IFSC: HDFC0001234</text>
  
  <!-- Cheque Date Box -->
  <rect x="420" y="38" width="130" height="24" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="485" y="54" text-anchor="middle" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#334155">2 8 0 9 2 0 2 6</text>
  
  <text x="45" y="115" font-family="Arial, sans-serif" font-size="12" fill="#64748B">PAY / भुगतान करें:</text>
  <line x1="160" y1="115" x2="550" y2="115" stroke="#CBD5E1" stroke-width="1"/>
  <text x="170" y="110" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A">DHOBIPRO VENDOR SETTLEMENT ACC</text>
  
  <text x="45" y="155" font-family="Arial, sans-serif" font-size="12" fill="#64748B">RUPEES / रुपये:</text>
  <line x1="150" y1="155" x2="420" y2="155" stroke="#CBD5E1" stroke-width="1"/>
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F172A">FOR CANCELLED CHEQUE VERIFICATION ONLY</text>
  
  <!-- Amount Box -->
  <rect x="430" y="132" width="120" height="32" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="490" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">₹  ***VOID***</text>
  
  <!-- Account Number -->
  <rect x="45" y="195" width="260" height="32" rx="4" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="55" y="216" font-family="Arial, sans-serif" font-size="11" fill="#065F46">A/C NO:</text>
  <text x="125" y="217" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#047857">50100987654321</text>
  
  <!-- CANCELLED WATERMARK -->
  <text x="300" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="rgba(220, 38, 38, 0.25)" transform="rotate(-12, 300, 220)">CANCELLED CHEQUE</text>
  
  <!-- Micr Band -->
  <rect x="25" y="260" width="550" height="35" fill="#F8FAFC"/>
  <text x="300" y="282" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="bold" letter-spacing="4" fill="#334155">⑈441240⑈ 411240012⑆ 004521⑈ 10</text>
</svg>
