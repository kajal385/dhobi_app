<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <filter id="docShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Certificate Background -->
  <rect x="10" y="10" width="580" height="400" rx="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#docShadow)"/>
  <rect x="18" y="18" width="564" height="384" rx="8" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1.5"/>
  
  <!-- Certificate Header -->
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">MINISTRY OF MICRO, SMALL &amp; MEDIUM ENTERPRISES</text>
  <text x="300" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#0C4A6E">UDYAM REGISTRATION CERTIFICATE</text>
  <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#0284C7">GOVERNMENT OF MAHARASHTRA • COMMERCIAL SHOP ACT</text>
  
  <line x1="40" y1="105" x2="560" y2="105" stroke="#0284C7" stroke-width="1.5"/>
  
  <!-- Certificate Content Table -->
  <!-- Row 1 -->
  <rect x="40" y="120" width="520" height="38" rx="4" fill="#E0F2FE"/>
  <text x="55" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369A1">UDYAM REGISTRATION NUMBER:</text>
  <text x="300" y="144" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#0369A1">UDYAM-MH-12-0044892</text>
  
  <!-- Row 2 -->
  <text x="55" y="185" font-family="Arial, sans-serif" font-size="12" fill="#64748B">NAME OF ENTERPRISE:</text>
  <text x="240" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">STAR WASH ULTRA PREMIUM / LAUNDRY HUB</text>
  
  <!-- Row 3 -->
  <text x="55" y="215" font-family="Arial, sans-serif" font-size="12" fill="#64748B">TYPE OF ENTERPRISE:</text>
  <text x="240" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803D">MICRO SERVICES ENTERPRISE (ACTIVE)</text>
  
  <!-- Row 4 -->
  <text x="55" y="245" font-family="Arial, sans-serif" font-size="12" fill="#64748B">MAJOR ACTIVITY:</text>
  <text x="240" y="245" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0F172A">SERVICES - COMMERCIAL LAUNDRY &amp; DRY CLEANING</text>
  
  <!-- Row 5 -->
  <text x="55" y="275" font-family="Arial, sans-serif" font-size="12" fill="#64748B">REGISTERED SHOP ADDRESS:</text>
  <text x="240" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">Shop 4, Bhujbal Chowk, Tathawade, Pune - 411057</text>
  
  <!-- Row 6 -->
  <text x="55" y="305" font-family="Arial, sans-serif" font-size="12" fill="#64748B">GST COMPLIANCE STATUS:</text>
  <text x="240" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284C7">27AABCU9603R1ZM (VERIFIED REGULAR)</text>
  
  <line x1="40" y1="325" x2="560" y2="325" stroke="#CBD5E1" stroke-width="1"/>
  
  <!-- Official Seal Stamp -->
  <circle cx="110" cy="365" r="26" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="110" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#DC2626">GOVT VERIFIED</text>
  <text x="110" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#DC2626">PUNE MSME</text>
  
  <!-- QR / Digital Signature -->
  <rect x="470" y="335" width="80" height="55" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="510" y="365" text-anchor="middle" font-size="28">📜</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#059669">Digitally Verified &amp; Compliant with DhobiPro Standards</text>
</svg>
